<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>ปังจุ่มนม · ระบบหลังบ้าน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ea;--card:#fffdf7;--ink:#2b1a14;--mut:#7a655b;--red:#a81804;--red2:#f3dcc9;--ln:#ead9c3;--ok:#2e7d4f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e1411;--card:#2a1d18;--ink:#f6e9da;--mut:#b49c8e;--red:#ff7a5c;--red2:#4a2a20;--ln:#45322a;--ok:#6fcf97;--bad:#ff8a7a}}
:root[data-theme=dark]{--bg:#1e1411;--card:#2a1d18;--ink:#f6e9da;--mut:#b49c8e;--red:#ff7a5c;--red2:#4a2a20;--ln:#45322a;--ok:#6fcf97;--bad:#ff8a7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Thai',sans-serif}
header{background:var(--red) conic-gradient(#0002 25%,transparent 0 50%,#0002 0 75%,transparent 0) 0 0/28px 28px;color:#fff8ea;padding:14px 16px 0}
.top{display:flex;align-items:center;gap:12px;max-width:1000px;margin:auto}
.top img{height:54px;background:#fff8ea;border-radius:12px;padding:4px}
h1{font:700 20px Mali,sans-serif;margin:0}.top small{opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1000px;margin:10px auto 0}
nav button{font:600 14px 'Noto Sans Thai';border:0;background:transparent;color:#fff8ea;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--red)}
main{max-width:1000px;margin:auto;padding:16px}
h2{font:700 18px Mali,sans-serif;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.c b{display:block;font:700 22px Mali}.c span{color:var(--mut);font-size:13px}
.w{overflow-x:auto;background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}
th{background:var(--red2);font-weight:600}td.n,th.n{text-align:right}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:5px 7px;max-width:140px}
input[type=number]{width:84px;text-align:right}
button.b{font:600 14px 'Noto Sans Thai';background:var(--red);color:#fff8ea;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
tr.sel td{background:var(--red2)}tr.m{cursor:pointer}
.ok{color:var(--ok)}.bad{color:var(--bad)}.bar{height:10px;background:var(--red);border-radius:5px}
.hint{color:var(--mut);font-size:13px;margin:-4px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
</style></head><body>

function menu(){const m=S.menu[sel],v=S.set.vat/100;
return `<p class="hint">ต้นทุนรวมเผื่อสูญเสีย ${S.set.waste}% · ราคาแนะนำ = ต้นทุน ÷ (1 − กำไรเป้า ${S.set.tm}%) · กดแถวเพื่อแก้สูตร</p><div class="w"><table><tr><th>เมนู</th><th class="n">ราคาขาย</th><th class="n">ต้นทุน</th><th class="n">รวมสูญเสีย</th><th class="n">กำไร/จาน</th><th class="n">กำไร%</th><th class="n">ราคาแนะนำ</th><th class="n">รวม VAT</th></tr>
${S.menu.map((x,i)=>{const c=costW(x),pf=x.p-c,mg=x.p?pf/x.p:0,sg=c/(1-S.set.tm/100);return `<tr class="m${i==sel?' sel':''}" data-sel="${i}"><td>${x.n}</td><td class="n">${I('menu',i,'p')}</td><td class="n">${f(cost(x))}</td><td class="n">${f(c)}</td><td class="n ${pf<0?'bad':''}">${f(pf)}</td><td class="n ${mg*100<S.set.tm?'bad':'ok'}">${pc(mg)}</td><td class="n">${f(Math.ceil(sg))}</td><td class="n">${f(Math.ceil(sg*(1+v)))}</td></tr>`}).join('')}</table></div>
<h2>สูตร: ${m.n}</h2><p class="hint">ปริมาณในสูตรเป็นค่าประมาณ — แก้ให้ตรงกับที่ใช้จริง</p><div class="w"><table><tr><th>วัตถุดิบ</th><th class="n">ปริมาณ</th><th>หน่วย</th><th class="n">ต้นทุน</th><th></th></tr>
${m.r.map(([n,q],j)=>`<tr><td><select data-rl="${j}" data-f="0">${opts(names(),n)}</select></td><td class="n"><input data-rl="${j}" data-f="1" type="number" step="any" value="${q}"></td><td>${useU(n)}</td><td class="n">${f(uc(n)*q)}</td><td><button class="x" data-rdel="${j}" aria-label="ลบ">✕</button></td></tr>`).join('')}
<tr><td colspan="3"><b>ต้นทุนวัตถุดิบ</b></td><td class="n"><b>${f(cost(m))}</b></td><td></td></tr></table></div><button class="b" id="addr">+ เพิ่มวัตถุดิบในสูตร</button>`}
function waste(){const W=S.waste.reduce((s,w)=>s+wv(w),0),by={};S.waste.forEach(w=>by[w.why]=(by[w.why]||0)+wv(w));const tb=total('วัตถุดิบ')+total('บรรจุภัณฑ์');
return `<div class="g"><div class="c"><span>มูลค่าสูญเสียรวม</span><b class="bad">฿${f(W)}</b></div><div class="c"><span>สัดส่วนต่อยอดซื้อ</span><b>${pc(tb?W/tb:0)}</b></div><div class="c"><span>เผื่อสูญเสียในสูตร</span><b>${S.set.waste}%</b></div></div>
<div class="row"><input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="wn">${opts(names())}</select><input id="wq" type="number" step="any" placeholder="ปริมาณ"><select id="wy">${opts(WHY)}</select><button class="b" id="addw">บันทึกสูญเสีย</button></div>
${S.waste.length?`<div class="w"><table><tr><th>วันที่</th><th>รายการ</th><th class="n">ปริมาณ</th><th>สาเหตุ</th><th class="n">มูลค่า</th><th></th></tr>${S.waste.map((w,i)=>`<tr><td>${w.d}</td><td>${w.name}</td><td class="n">${f(w.qty)} ${useU(w.name)}</td><td>${w.why}</td><td class="n bad">${f(wv(w))}</td><td><button class="x" data-del="waste" data-i="${i}" aria-label="ลบ">✕</button></td></tr>`).join('')}</table></div>
<h2>แยกตามสาเหตุ</h2><div class="w"><table>${Object.entries(by).map(([k,x])=>`<tr><td>${k}</td><td class="n">฿${f(x)}</td></tr>`).join('')}</table></div>`:'<p class="hint">ยังไม่มีบันทึก — เลือกวัตถุดิบที่เสีย ใส่ปริมาณ แล้วกดบันทึก ระบบคิดมูลค่าจากต้นทุนต่อหน่วยให้</p>'}`}
function set(){const r=(k,l)=>`<tr><td>${l}</td><td class="n"><input data-s="${k}" type="number" step="any" value="${S.set[k]}"></td></tr>`;
return `<div class="w"><table>${r('waste','เผื่อสูญเสียในสูตร (%)')+r('vat','VAT (%)')+r('tm','กำไรเป้าหมายต่อจาน (%)')+r('budget','งบซื้อวัตถุดิบ (บาท)')}</table></div><h2>เชื่อม Google Apps Script</h2><p class="hint">วาง URL ของ Web App และรหัสลับ (ถ้าตั้งไว้ใน Code.gs) แล้วกดส่งขึ้นหรือดึงข้อมูลลงเมื่อต้องการซิงก์</p><div class="row"><input data-g="gs" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${S.gs||''}" style="max-width:none;flex:1;min-width:220px"><input data-g="key" type="text" placeholder="รหัสลับ" value="${S.key||''}"></div><div class="row"><button class="b" id="gsave">ส่งขึ้น Google Sheet</button><button class="b" id="gload">ดึงข้อมูลจาก Sheet</button><span id="st" class="hint"></span></div><button class="b" id="rst" style="background:var(--mut)">คืนค่าเริ่มต้น (ล้างข้อมูลที่แก้)</button>`}
const R={dash,buy,menu,waste,set};
function draw(){$nav.innerHTML=T.map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('');v.innerHTML=R[tab]()}
const $nav=document.getElementById('nav'),v=document.getElementById('v');
document.addEventListener('change',e=>{const d=e.target.dataset,x=e.target;
if(d.a){S[d.a][d.i][d.k]=x.type=='number'?+x.value:x.value}
else if(d.rl){S.menu[sel].r[d.rl][d.f]=d.f==1?+x.value:x.value}
else if(d.s){S.set[d.s]=+x.value}else if(d.g){S[d.g]=x.value.trim()}else return;save();draw()});
document.addEventListener('click',e=>{const x=e.target.closest('button,tr.m');if(!x)return;if(x.id=='gsave'||x.id=='gload'){gs(x.id);return}const d=x.dataset;
if(d.t)tab=d.t;else if(d.sel!==undefined){if(e.target.closest('input'))return;sel=+d.sel}
else if(d.del)S[d.del].splice(d.i,1);else if(d.rdel)S.menu[sel].r.splice(d.rdel,1);
else if(x.id=='addb')S.buys.push({d:new Date().toISOString().slice(0,10),cat:'วัตถุดิบ',name:'รายการใหม่',size:1,packs:1,price:0,disc:0,ship:0,use:'ชิ้น'});
else if(x.id=='addr')S.menu[sel].r.push([names()[0],1]);
else if(x.id=='addw'){const q=+document.getElementById('wq').value;if(!q)return;S.waste.push({d:wd.value,name:wn.value,qty:q,why:wy.value})}
else if(x.id=='rst'){if(!confirm('ล้างข้อมูลที่แก้ไขทั้งหมด?'))return;S={set:{vat:7,waste:5,budget:20000,tm:60},buys:D.buys,menu:D.menu,waste:[]}}
else return;save();draw()});
const say=t=>{const e=document.getElementById('st');if(e)e.textContent=t};
async function gs(w){if(!S.gs)return say('ใส่ URL ก่อน');say('กำลังทำงาน...');
try{let r;if(w=='gsave'){const{gs:a,key:k,...st}=S;r=await fetch(S.gs,{method:'POST',body:JSON.stringify({action:'save',key:S.key||'',state:st})})}
else r=await fetch(S.gs+(S.gs.includes('?')?'&':'?')+'action=load&key='+encodeURIComponent(S.key||''));
const j=await r.json();if(!j.ok)return say('ไม่สำเร็จ: '+(j.error||'ตอบกลับผิดปกติ'));
if(w=='gload'){S={...j.state,gs:S.gs,key:S.key};save();draw();say('ดึงข้อมูลแล้ว')}else say('ส่งขึ้นแล้ว '+new Date().toLocaleTimeString('th-TH'))}
catch(e){say('เชื่อมต่อไม่ได้ ตรวจ URL และสิทธิ์ของ Web App')}}
draw();
</script></body></html>
